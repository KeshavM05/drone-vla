<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drone VLA — Command Center</title>
<style>
:root {
  --bg: #0a0e17;
  --panel: #111827;
  --border: #1e293b;
  --text: #e2e8f0;
  --muted: #64748b;
  --accent: #3b82f6;
  --green: #22c55e;
  --yellow: #eab308;
  --red: #ef4444;
  --orange: #f97316;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
  font-size: 13px;
  height: 100vh;
  overflow: hidden;
}

.grid {
  display: grid;
  grid-template-columns: 280px 1fr 320px;
  grid-template-rows: 48px 1fr 140px;
  height: 100vh;
  gap: 1px;
  background: var(--border);
}

/* Header */
.header {
  grid-column: 1 / -1;
  background: var(--panel);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
}

.header h1 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.header h1 span { color: var(--accent); }

.status-bar {
  display: flex;
  gap: 20px;
  font-size: 12px;
  color: var(--muted);
}

.status-bar .live {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}

.status-dot.disconnected { background: var(--red); animation: none; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Drone panel */
.drone-panel {
  background: var(--panel);
  overflow-y: auto;
  padding: 8px;
}

.panel-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  padding: 4px 8px 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}

.drone-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.2s;
}

.drone-card:hover, .drone-card.active {
  border-color: var(--accent);
}

.drone-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.drone-id {
  font-weight: 700;
  font-size: 14px;
}

.drone-status {
  font-size: 10px;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 3px;
  font-weight: 600;
}

.drone-status.armed { background: rgba(34, 197, 94, 0.2); color: var(--green); }
.drone-status.flying { background: rgba(59, 130, 246, 0.2); color: var(--accent); }
.drone-status.alert { background: rgba(239, 68, 68, 0.2); color: var(--red); }
.drone-status.offline { background: rgba(100, 116, 139, 0.2); color: var(--muted); }

.drone-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  font-size: 11px;
}

.stat { color: var(--muted); }
.stat b { color: var(--text); font-weight: 500; }

/* Main view */
.main-view {
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

.map-canvas {
  width: 100%;
  height: 100%;
}

.map-overlay {
  position: absolute;
  bottom: 12px;
  left: 12px;
  font-size: 11px;
  color: var(--muted);
  background: rgba(10, 14, 23, 0.8);
  padding: 4px 8px;
  border-radius: 4px;
}

/* Right panel (logs + alerts) */
.right-panel {
  background: var(--panel);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.alerts-section {
  padding: 8px;
  border-bottom: 1px solid var(--border);
  max-height: 120px;
  overflow-y: auto;
}

.alert-item {
  font-size: 11px;
  padding: 4px 6px;
  margin-bottom: 2px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.alert-item.critical { background: rgba(239, 68, 68, 0.1); color: var(--red); }
.alert-item.warning { background: rgba(234, 179, 8, 0.1); color: var(--yellow); }

.logs-section {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.log-entry {
  font-size: 11px;
  padding: 3px 0;
  border-bottom: 1px solid rgba(30, 41, 59, 0.5);
  display: flex;
  gap: 6px;
}

.log-time { color: var(--muted); white-space: nowrap; }
.log-source {
  font-weight: 600;
  white-space: nowrap;
  min-width: 50px;
}
.log-source.system { color: var(--accent); }
.log-source.operator { color: var(--green); }
.log-source.nlp { color: var(--orange); }
.log-source.ca { color: var(--red); }
.log-source.drone { color: var(--yellow); }

.log-msg { word-break: break-word; }
.log-entry.error .log-msg { color: var(--red); }
.log-entry.warning .log-msg { color: var(--yellow); }

/* Command bar */
.command-bar {
  grid-column: 1 / -1;
  background: var(--panel);
  display: flex;
  align-items: center;
  padding: 8px 16px;
  gap: 8px;
}

.cmd-input-wrap {
  flex: 1;
  position: relative;
}

.cmd-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 14px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}

.cmd-input:focus { border-color: var(--accent); }

.cmd-input::placeholder { color: var(--muted); }

.cmd-btn {
  background: var(--accent);
  border: none;
  color: white;
  padding: 10px 20px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: opacity 0.2s;
}

.cmd-btn:hover { opacity: 0.85; }

.voice-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--bg);
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  font-size: 18px;
}

.voice-btn:hover { border-color: var(--accent); color: var(--text); }
.voice-btn.active {
  border-color: var(--red);
  background: rgba(239, 68, 68, 0.15);
  color: var(--red);
  animation: pulse 1s infinite;
}

.cmd-hint {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}

/* Camera feed overlay */
.camera-overlay {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 240px;
  height: 180px;
  background: #000;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

.camera-overlay .cam-label {
  position: absolute;
  top: 4px;
  left: 8px;
  font-size: 10px;
  text-transform: uppercase;
  color: var(--green);
  font-weight: 600;
  text-shadow: 0 0 4px rgba(0,0,0,0.8);
}

.camera-overlay canvas {
  width: 100%;
  height: 100%;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="grid">
  <!-- Header -->
  <div class="header">
    <h1><span>Drone VLA</span> Command Center</h1>
    <div class="status-bar">
      <div class="live">
        <div class="status-dot" id="connectionDot"></div>
        <span id="connectionStatus">Connecting...</span>
      </div>
      <span id="swarmState">SWARM: —</span>
      <span id="clock"></span>
    </div>
  </div>

  <!-- Left: Drone Cards -->
  <div class="drone-panel">
    <div class="panel-title">Fleet Status</div>
    <div id="droneCards"></div>
  </div>

  <!-- Center: Map -->
  <div class="main-view">
    <canvas class="map-canvas" id="mapCanvas"></canvas>
    <div class="map-overlay" id="mapOverlay">LOCAL NED — Grid: 10m</div>
    <div class="camera-overlay" id="cameraOverlay" style="display:none;">
      <span class="cam-label" id="camLabel">CAM 1</span>
      <canvas id="camCanvas"></canvas>
    </div>
  </div>

  <!-- Right: Alerts + Logs -->
  <div class="right-panel">
    <div class="panel-title">Alerts</div>
    <div class="alerts-section" id="alertsSection">
      <div style="color: var(--muted); font-size: 11px; padding: 4px;">No active alerts</div>
    </div>
    <div class="panel-title">Event Log</div>
    <div class="logs-section" id="logsSection"></div>
  </div>

  <!-- Bottom: Command Bar -->
  <div class="command-bar">
    <button class="voice-btn" id="voiceBtn" title="Hold to speak">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <div class="cmd-input-wrap">
      <input class="cmd-input" id="cmdInput" type="text"
             placeholder="Type a command... (e.g., 'send all drones to search the north field')"
             autocomplete="off">
    </div>
    <button class="cmd-btn" id="sendBtn">Send</button>
    <div class="cmd-hint">Enter to send</div>
  </div>
</div>

<script>
const DRONE_COLORS = ['#3b82f6', '#22c55e', '#f97316', '#a855f7', '#ef4444'];
let drones = [];
let alerts = [];
let swarmState = 'disconnected';
let selectedDrone = null;
let ws = null;
let wsConnected = false;

// --- WebSocket ---
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    wsConnected = true;
    document.getElementById('connectionDot').className = 'status-dot';
    document.getElementById('connectionStatus').textContent = 'Connected';
    addLog('info', 'system', 'WebSocket connected');
  };

  ws.onclose = () => {
    wsConnected = false;
    document.getElementById('connectionDot').className = 'status-dot disconnected';
    document.getElementById('connectionStatus').textContent = 'Disconnected';
    setTimeout(connectWS, 2000);
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'telemetry') {
      drones = msg.data.drones;
      alerts = msg.data.alerts;
      swarmState = msg.data.swarm_state;
      renderDroneCards();
      renderAlerts();
      document.getElementById('swarmState').textContent = `SWARM: ${swarmState.toUpperCase()}`;
    } else if (msg.type === 'log') {
      addLogEntry(msg.data);
    } else if (msg.type === 'command_result') {
      handleCommandResult(msg.data);
    }
  };
}

// --- Drone Cards ---
function renderDroneCards() {
  const container = document.getElementById('droneCards');
  container.innerHTML = drones.map(d => {
    const statusClass = d.armed ? (d.task_active ? 'flying' : 'armed') : 'offline';
    const statusText = d.armed ? (d.task_active ? 'Flying' : 'Armed') : 'Offline';
    const active = selectedDrone === d.drone_id ? 'active' : '';
    const color = DRONE_COLORS[(d.drone_id - 1) % DRONE_COLORS.length];

    return `
      <div class="drone-card ${active}" onclick="selectDrone(${d.drone_id})"
           style="border-left: 3px solid ${color}">
        <div class="drone-card-header">
          <span class="drone-id" style="color:${color}">DRONE ${d.drone_id}</span>
          <span class="drone-status ${statusClass}">${statusText}</span>
        </div>
        <div class="drone-stats">
          <div class="stat">ALT <b>${d.alt_agl_m.toFixed(1)}m</b></div>
          <div class="stat">LAYER <b>${d.assigned_alt_m.toFixed(0)}m</b></div>
          <div class="stat">POS <b>${d.x.toFixed(1)}, ${d.y.toFixed(1)}</b></div>
          <div class="stat">WP <b>${d.task_wp}</b></div>
          <div class="stat">VEL <b>${Math.sqrt(d.vx*d.vx + d.vy*d.vy).toFixed(1)} m/s</b></div>
          <div class="stat">HDG <b>${(d.heading_rad * 180 / Math.PI).toFixed(0)}&deg;</b></div>
        </div>
      </div>
    `;
  }).join('');
}

function selectDrone(id) {
  selectedDrone = selectedDrone === id ? null : id;
  renderDroneCards();
}

// --- Alerts ---
function renderAlerts() {
  const section = document.getElementById('alertsSection');
  if (alerts.length === 0) {
    section.innerHTML = '<div style="color: var(--muted); font-size: 11px; padding: 4px;">No active alerts</div>';
    return;
  }
  section.innerHTML = alerts.map(a => {
    const cls = a.critical ? 'critical' : 'warning';
    const icon = a.critical ? '!!' : '!';
    return `<div class="alert-item ${cls}">
      <b>${icon}</b> Drone ${a.drone_a} ↔ Drone ${a.drone_b}: ${a.distance_m}m
    </div>`;
  }).join('');
}

// --- Logs ---
function addLog(level, source, message) {
  addLogEntry({ timestamp: Date.now() / 1000, level, source, message });
}

function addLogEntry(entry) {
  const section = document.getElementById('logsSection');
  const d = new Date(entry.timestamp * 1000);
  const time = d.toLocaleTimeString('en-US', { hour12: false });

  const div = document.createElement('div');
  div.className = `log-entry ${entry.level}`;
  div.innerHTML = `
    <span class="log-time">${time}</span>
    <span class="log-source ${entry.source}">${entry.source}</span>
    <span class="log-msg">${escapeHtml(entry.message)}</span>
  `;
  section.appendChild(div);
  section.scrollTop = section.scrollHeight;

  // Keep max 200 entries in DOM
  while (section.children.length > 200) {
    section.removeChild(section.firstChild);
  }
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// --- Commands ---
function sendCommand() {
  const input = document.getElementById('cmdInput');
  const text = input.value.trim();
  if (!text) return;

  addLog('info', 'operator', text);
  input.value = '';

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'command', text }));
  } else {
    addLog('error', 'system', 'Not connected to server');
  }
}

function handleCommandResult(data) {
  if (data.status === 'parsed') {
    data.commands.forEach(cmd => {
      addLog('info', 'nlp',
        `→ ${cmd.mission_type}` +
        (cmd.assignment?.drone_ids?.length ? ` [Drones: ${cmd.assignment.drone_ids.join(',')}]` : ' [auto-assign]') +
        (cmd.altitude_agl_m ? ` @ ${cmd.altitude_agl_m}m` : '')
      );
    });
  }
}

document.getElementById('cmdInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendCommand();
});
document.getElementById('sendBtn').addEventListener('click', sendCommand);

// --- Voice ---
let recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    const transcript = Array.from(e.results)
      .map(r => r[0].transcript)
      .join('');
    document.getElementById('cmdInput').value = transcript;
    if (e.results[0].isFinal) {
      sendCommand();
    }
  };

  recognition.onend = () => {
    document.getElementById('voiceBtn').classList.remove('active');
  };
}

document.getElementById('voiceBtn').addEventListener('mousedown', () => {
  if (!recognition) {
    addLog('warning', 'system', 'Voice input not supported in this browser');
    return;
  }
  document.getElementById('voiceBtn').classList.add('active');
  recognition.start();
  addLog('info', 'system', 'Listening...');
});

document.getElementById('voiceBtn').addEventListener('mouseup', () => {
  if (recognition) recognition.stop();
});

// --- Map Canvas ---
function drawMap() {
  const canvas = document.getElementById('mapCanvas');
  const ctx = canvas.getContext('2d');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const scale = 4; // pixels per meter

  // Background
  ctx.fillStyle = '#0a0e17';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = '#1a1f2e';
  ctx.lineWidth = 0.5;
  const gridSpacing = 10 * scale;
  for (let x = cx % gridSpacing; x < canvas.width; x += gridSpacing) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = cy % gridSpacing; y < canvas.height; y += gridSpacing) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = '#2a3040';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();

  // Origin label
  ctx.fillStyle = '#475569';
  ctx.font = '10px monospace';
  ctx.fillText('0,0', cx + 4, cy - 4);
  ctx.fillText('N', cx + 4, 14);
  ctx.fillText('E', canvas.width - 14, cy - 4);

  // Proximity warning circles between close drones
  alerts.forEach(a => {
    const d1 = drones.find(d => d.drone_id === a.drone_a);
    const d2 = drones.find(d => d.drone_id === a.drone_b);
    if (d1 && d2) {
      const mx = cx + ((d1.x + d2.x) / 2) * scale;
      const my = cy - ((d1.y + d2.y) / 2) * scale;
      ctx.beginPath();
      ctx.arc(mx, my, 20, 0, Math.PI * 2);
      ctx.strokeStyle = a.critical ? 'rgba(239,68,68,0.5)' : 'rgba(234,179,8,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  });

  // Drones
  drones.forEach((d, i) => {
    const px = cx + d.x * scale;
    const py = cy - d.y * scale; // NED: y-north is up on screen
    const color = DRONE_COLORS[i % DRONE_COLORS.length];
    const isSelected = selectedDrone === d.drone_id;

    // Trail shadow
    ctx.beginPath();
    ctx.arc(px, py, isSelected ? 10 : 7, 0, Math.PI * 2);
    ctx.fillStyle = color + '30';
    ctx.fill();

    // Velocity vector
    if (d.vx !== 0 || d.vy !== 0) {
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + d.vx * scale * 2, py - d.vy * scale * 2);
      ctx.strokeStyle = color + '80';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Heading indicator
    const hx = px + Math.cos(d.heading_rad) * 14;
    const hy = py - Math.sin(d.heading_rad) * 14;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(hx, hy);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Drone body
    ctx.beginPath();
    ctx.arc(px, py, isSelected ? 6 : 4, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    // Label
    ctx.fillStyle = color;
    ctx.font = `${isSelected ? 'bold ' : ''}11px monospace`;
    ctx.fillText(`D${d.drone_id}`, px + 10, py - 6);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '9px monospace';
    ctx.fillText(`${d.alt_agl_m.toFixed(0)}m`, px + 10, py + 6);
  });

  requestAnimationFrame(drawMap);
}

// --- Clock ---
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-US', { hour12: false }) + ' UTC' + (-(now.getTimezoneOffset()/60));
  setTimeout(updateClock, 1000);
}

// --- Init ---
connectWS();
drawMap();
updateClock();
</script>
</body>
</html>
