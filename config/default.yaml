stt:
  model_size: "base.en"
  language: "en"
  device: "auto"  # cpu, cuda, or auto
  vad_filter: true
  beam_size: 5

llm:
  provider: "bedrock"
  region: "us-east-1"
  model_id: "us.anthropic.claude-sonnet-4-20250514"
