services:
  ardupilot-sitl-1:
    image: ardupilot/ardupilot-dev-ros:latest
    container_name: ardupilot_sitl_1
    environment:
      - INSTANCE=0
      - DISPLAY=${DISPLAY:-:0}
    command: >
      sim_vehicle.py
        -v ArduCopter
        --instance 0
        -l 47.397742,8.545594,488,0
        --out=udp:host.docker.internal:14550
        --out=udp:host.docker.internal:14551
        --no-rebuild
    ports:
      - "5760:5760"
    networks:
      - drone_net

  ardupilot-sitl-2:
    image: ardupilot/ardupilot-dev-ros:latest
    container_name: ardupilot_sitl_2
    environment:
      - INSTANCE=1
      - DISPLAY=${DISPLAY:-:0}
    command: >
      sim_vehicle.py
        -v ArduCopter
        --instance 1
        -l 47.397842,8.545694,488,0
        --out=udp:host.docker.internal:14560
        --out=udp:host.docker.internal:14561
        --no-rebuild
    ports:
      - "5770:5760"
    networks:
      - drone_net

  ardupilot-sitl-3:
    image: ardupilot/ardupilot-dev-ros:latest
    container_name: ardupilot_sitl_3
    environment:
      - INSTANCE=2
      - DISPLAY=${DISPLAY:-:0}
    command: >
      sim_vehicle.py
        -v ArduCopter
        --instance 2
        -l 47.397942,8.545794,488,0
        --out=udp:host.docker.internal:14570
        --out=udp:host.docker.internal:14571
        --no-rebuild
    ports:
      - "5780:5760"
    networks:
      - drone_net

  gazebo:
    image: ardupilot/ardupilot-dev-ros:latest
    container_name: gazebo_sim
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - GZ_SIM_RESOURCE_PATH=/opt/ros/humble/share
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    ports:
      - "11345:11345"
    networks:
      - drone_net
    command: gz sim -r iris_runway.sdf
    depends_on:
      - ardupilot-sitl-1
      - ardupilot-sitl-2
      - ardupilot-sitl-3

  ros2-gz-bridge:
    image: ardupilot/ardupilot-dev-ros:latest
    container_name: ros_gz_bridge
    environment:
      - ROS_DOMAIN_ID=0
    networks:
      - drone_net
    command: >
      ros2 launch ros_gz_bridge parameter_bridge.launch.py
    depends_on:
      - gazebo

networks:
  drone_net:
    driver: bridge
